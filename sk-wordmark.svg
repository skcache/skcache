           calcMode="discrete"
           values="12.0;19.2;26.4;33.6;40.8;48.0;55.2;62.4;69.6;76.8;84.0;91.2;98.4;105.6;112.8;120.0;127.2;134.4;141.6;148.8;156.0;163.2;170.4;177.6;184.8;192.0;199.2;206.4;213.6;220.8;228.0;235.2;242.4;249.6;256.8;264.0;271.2;278.4;285.6;292.8;300.0;307.2;314.4"
           keyTimes="0.00000;0.02381;0.04762;0.07143;0.09524;0.11905;0.14286;0.16667;0.19048;0.21429;0.23810;0.26190;0.28571;0.30952;0.33333;0.35714;0.38095;0.40476;0.42857;0.45238;0.47619;0.50000;0.52381;0.54762;0.57143;0.59524;0.61905;0.64286;0.66667;0.69048;0.71429;0.73810;0.76190;0.78571;0.80952;0.83333;0.85714;0.88095;0.90476;0.92857;0.95238;0.97619;1.00000"
           dur="1.18s"
           fill="freeze"/>
  <animate attributeName="opacity"
           values=".72;.72;0"
           keyTimes="0;.96;1"
           dur="1.28s"
           fill="freeze"/>
</rect>
</svg>