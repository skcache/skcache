<svg xmlns="http://www.w3.org/2000/svg" width="390" height="155" viewBox="0 0 390 155" role="img" aria-labelledby="title desc">
  <title id="title">Animated ASCII SK wordmark</title>
  <desc id="desc">The letters SK render as ASCII text, then receive a subtle left-to-right scan every ten seconds.</desc>

  <style>
    .ink { fill: #57606a; }
    .shine { fill: #24292f; opacity: .10; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #c9d1d9; }
      .shine { fill: #ffffff; opacity: .16; }
    }
  </style>

  <defs>
    <clipPath id="line1"><rect x="0" y="0" width="0" height="32"><animate attributeName="width" from="0" to="390" begin="0s" dur=".72s" fill="freeze"/></rect></clipPath>
    <clipPath id="line2"><rect x="0" y="30" width="0" height="32"><animate attributeName="width" from="0" to="390" begin=".11s" dur=".72s" fill="freeze"/></rect></clipPath>
    <clipPath id="line3"><rect x="0" y="60" width="0" height="32"><animate attributeName="width" from="0" to="390" begin=".22s" dur=".72s" fill="freeze"/></rect></clipPath>
    <clipPath id="line4"><rect x="0" y="90" width="0" height="32"><animate attributeName="width" from="0" to="390" begin=".33s" dur=".72s" fill="freeze"/></rect></clipPath>
    <clipPath id="line5"><rect x="0" y="120" width="0" height="32"><animate attributeName="width" from="0" to="390" begin=".44s" dur=".72s" fill="freeze"/></rect></clipPath>

    <linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".38" stop-color="white" stop-opacity=".15"/>
      <stop offset=".52" stop-color="white" stop-opacity=".9"/>
      <stop offset=".66" stop-color="white" stop-opacity=".15"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <mask id="scanMask" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="155">
      <rect x="-90" y="0" width="90" height="155" fill="url(#scanGradient)">
        <animate attributeName="x"
                 values="-90;390;390"
                 keyTimes="0;.13;1"
                 begin="2.3s"
                 dur="10s"
                 repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
     font-size="25" font-weight="600" xml:space="preserve">
    <text class="ink" x="26" y="27" clip-path="url(#line1)">   _____      __ __</text>
    <text class="ink" x="26" y="57" clip-path="url(#line2)">  / ___/     / //_/</text>
    <text class="ink" x="26" y="87" clip-path="url(#line3)">  \__ \     / ,&lt;</text>
    <text class="ink" x="26" y="117" clip-path="url(#line4)"> ___/ /    / /| |</text>
    <text class="ink" x="26" y="147" clip-path="url(#line5)">/____/    /_/ |_|</text>

    <g class="shine" mask="url(#scanMask)">
      <text x="26" y="27">   _____      __ __</text>
      <text x="26" y="57">  / ___/     / //_/</text>
      <text x="26" y="87">  \__ \     / ,&lt;</text>
      <text x="26" y="117"> ___/ /    / /| |</text>
      <text x="26" y="147">/____/    /_/ |_|</text>
    </g>
  </g>
</svg>