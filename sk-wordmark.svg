    <text class="bright" xml:space="preserve" x="12" y="18.7" textLength="302.4" lengthAdjust="spacing">  SS%%%%%%%%%%%%%   ss%%%%%%   sss########</text><text class="bright" xml:space="preserve" x="12" y="30.5" textLength="302.4" lengthAdjust="spacing">SS%%%%%%%%%%%%%%%   cc%%%%%% sss########  </text><text class="bright" xml:space="preserve" x="12" y="42.3" textLength="302.4" lengthAdjust="spacing">S%%%%%%%%%%%%%%%%   cc%%%%%#ss#########   </text><text class="bright" xml:space="preserve" x="12" y="54.1" textLength="302.4" lengthAdjust="spacing">S%%%%%%       -=%   cc%%%%%#s########     </text><text class="bright" xml:space="preserve" x="12" y="65.9" textLength="302.4" lengthAdjust="spacing">c%%%%%%%%%          cc%%%%%########       </text><text class="bright" xml:space="preserve" x="12" y="77.7" textLength="302.4" lengthAdjust="spacing">c%%%%%%%%%%%%%%%    cc%%%%%#######        </text><text class="bright" xml:space="preserve" x="12" y="89.5" textLength="302.4" lengthAdjust="spacing"> =%%%%%%%%%%%%%%%%  cc%%%%########        </text><text class="bright" xml:space="preserve" x="12" y="101.3" textLength="302.4" lengthAdjust="spacing">   -%%%%%%%%%%%%%%  cc%%%%#########       </text><text class="bright" xml:space="preserve" x="12" y="113.1" textLength="302.4" lengthAdjust="spacing">          %%%%%%%%% cc%%%%###########     </text><text class="bright" xml:space="preserve" x="12" y="124.9" textLength="302.4" lengthAdjust="spacing">c%%%      sS%%%%%%% cc%%%%##--#########   </text><text class="bright" xml:space="preserve" x="12" y="136.7" textLength="302.4" lengthAdjust="spacing">c%%%%%%%%%%%%%%%%%  cc%%%###  -#########  </text><text class="bright" xml:space="preserve" x="12" y="148.5" textLength="302.4" lengthAdjust="spacing">c%%%%%%%%%%%%%%%%%  cc%%%###   --#########</text><text class="bright" xml:space="preserve" x="12" y="160.3" textLength="302.4" lengthAdjust="spacing"> %%%%%%%%%%%%%%%    cc%%%###      -#######</text>
  </g>
</g>

