<svg xmlns="http://www.w3.org/2000/svg" width="326" height="171" viewBox="0 0 326.4 171.4" role="img" aria-labelledby="title desc">
<title id="title">Animated ASCII SK wordmark</title>
<desc id="desc">A dense ASCII SK wordmark reveals left to right, then receives a subtle scan every ten seconds.</desc>
<!-- Visual direction inspired by AVIVASHISHTA29's animated ASCII wordmark; implementation here is custom for SK. -->
<style>
  .base { fill: #57606a; }
  .bright { fill: #24292f; }
  .cursor { fill: #24292f; opacity: .75; }
  @media (prefers-color-scheme: dark) {
    .base { fill: #8b949e; }
    .bright { fill: #f0f6fc; }
    .cursor { fill: #f0f6fc; opacity: .7; }
  }
</style>
<defs>
  <clipPath id="reveal">
    <rect x="12" y="0" width="0" height="171.4">
      <animate attributeName="width"
               calcMode="discrete"
               values="0.0;7.2;14.4;21.6;28.8;36.0;43.2;50.4;57.6;64.8;72.0;79.2;86.4;93.6;100.8;108.0;115.2;122.4;129.6;136.8;144.0;151.2;158.4;165.6;172.8;180.0;187.2;194.4;201.6;208.8;216.0;223.2;230.4;237.6;244.8;252.0;259.2;266.4;273.6;280.8;288.0;295.2;302.4"
               keyTimes="0.00000;0.02381;0.04762;0.07143;0.09524;0.11905;0.14286;0.16667;0.19048;0.21429;0.23810;0.26190;0.28571;0.30952;0.33333;0.35714;0.38095;0.40476;0.42857;0.45238;0.47619;0.50000;0.52381;0.54762;0.57143;0.59524;0.61905;0.64286;0.66667;0.69048;0.71429;0.73810;0.76190;0.78571;0.80952;0.83333;0.85714;0.88095;0.90476;0.92857;0.95238;0.97619;1.00000"
               dur="1.18s"
               fill="freeze"/>
    </rect>
  </clipPath>
  <linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="black"/>
    <stop offset=".30" stop-color="black"/>
    <stop offset=".50" stop-color="white"/>
    <stop offset=".70" stop-color="black"/>
    <stop offset="1" stop-color="black"/>
  </linearGradient>
  <mask id="scanMask" maskUnits="userSpaceOnUse" x="0" y="0" width="326.4" height="171.4">
    <rect x="-78" y="0" width="78" height="171.4" fill="url(#scanGradient)">
      <animate attributeName="x"
               values="-78;326.4;326.4"
               keyTimes="0;.13;1"
               begin="2.8s"
               dur="10s"
               repeatCount="indefinite"/>
    </rect>
  </mask>
</defs>

